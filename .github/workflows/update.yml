name: Update filtered calendar

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}     # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run filter script
        run: python filter.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar_filtered.ics
          git diff --staged --quiet || git commit -m "Auto-update filtered calendar"
          git push
